# Релиз maistep: на каждый push в main, где "version" в package.json стал новым (нет релиза v<версия>),
# собирает установщики Windows и Linux (scripts/release.mjs build на своей ОС), из обоих бинарей — один файл
# обновления maistep-<версия>-update.mai (pack) и публикует GitHub Release.
# Установленные копии видят релиз при старте / раз в час и докачивают только изменившиеся куски .mai
# (server/maistep/updater.py).
name: release

on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      new: ${{ steps.ver.outputs.new }}
    steps:
      - uses: actions/checkout@v4
      - name: Новая версия?
        id: ver
        run: |
          v=$(node -p "require('./package.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" >/dev/null 2>&1; then
            echo "релиз v$v уже есть — сборка не нужна"
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.new == 'true'
    strategy:
      matrix:
        include:
          - os: windows-latest
            plat: windows-x86_64
          # 22.04 — старый glibc: AppImage запустится и на более старых дистрибутивах
          - os: ubuntu-22.04
            plat: linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
          key: ${{ matrix.plat }}
      - name: Библиотеки Tauri (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf file
      - name: Сборка
        run: node scripts/release.mjs build
      - name: Проверка установщика без окна (Linux)
        if: runner.os == 'Linux'
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          setup=$(ls dist/maistep-*-setup-linux.AppImage)
          "$setup" --silent --dir "$RUNNER_TEMP/inst"
          test -x "$RUNNER_TEMP/inst/maistep.AppImage"
          test -f "$RUNNER_TEMP/inst/server/main.py"
          test -f "$RUNNER_TEMP/inst/manifest.json"
          cmp <(head -c "$(stat -c %s "$RUNNER_TEMP/inst/maistep.AppImage")" "$setup") "$RUNNER_TEMP/inst/maistep.AppImage"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.plat }}
          path: |
            dist/bin/
            dist/maistep-*-setup-*
          retention-days: 3

  publish:
    needs: [check, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # release.mjs проверяет, что коммит есть в origin
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Файл обновления
        run: node scripts/release.mjs pack
      - name: Публикация v${{ needs.check.outputs.version }}
        run: node scripts/release.mjs publish
